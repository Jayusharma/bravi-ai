version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: eventops_postgres
    restart: always
    environment:
      POSTGRES_USER: eventops
      POSTGRES_PASSWORD: eventops
      POSTGRES_DB: eventops_db
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: enquiry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:




